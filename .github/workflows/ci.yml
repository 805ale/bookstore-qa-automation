name: CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 20
            cache: 'npm'
            cache-dependency-path: |
                server/package-lock.json
                client/package-lock.json
                frontend/package-lock.json

      # Install deps
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Install test deps
        working-directory: frontend
        run: npm ci

      # Build client and serve on port 3000
      - name: Build client
        working-directory: client
        run: npm run build

      - name: Start client (vite preview on 3000)
        working-directory: client
        run: |
          nohup npm run preview >/dev/null 2>&1 &
      
      # Start API in test mode on 2002, pointing to GitHub's mongo service
      - name: Start API (test)
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 2002
          MONGO_URI: mongodb://127.0.0.1:27017/bookstore_qa_test
        run: |
          nohup npm run start:test >/dev/null 2>&1 &

      # Wait for both servers
      - name: Wait for UI and API
        run: |
          npx --yes wait-on http-get://localhost:3000 http-get://localhost:2002

      # Install Playwright browsers
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # Run tests headless against UI:3000 & API:2002
      - name: Run Playwright tests
        working-directory: frontend
        env:
          UI_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:2002
        run: npx playwright test --reporter=html

      # Always upload report & traces (even on failure)
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
